name: OpenSoft images

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: opensoft-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty-server
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/opensoft-crm,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      # Reuses the server layers built above, so only the frontend is new.
      - name: Build server and frontend image
        id: full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/opensoft-crm-full,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Save digests
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          FULL_DIGEST: ${{ steps.full.outputs.digest }}
        run: |
          mkdir -p digests/opensoft-crm digests/opensoft-crm-full
          touch "digests/opensoft-crm/${SERVER_DIGEST#sha256:}"
          touch "digests/opensoft-crm-full/${FULL_DIGEST#sha256:}"
      - name: Upload digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          retention-days: 1

  publish:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag multi-arch images
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          for image in opensoft-crm opensoft-crm-full; do
            refs=()
            for digest in "digests/$image"/*; do
              refs+=("$REGISTRY/$image@sha256:$(basename "$digest")")
            done
            docker buildx imagetools create \
              -t "$REGISTRY/$image:latest" \
              -t "$REGISTRY/$image:sha-${SHORT_SHA::7}" \
              "${refs[@]}"
            docker buildx imagetools inspect "$REGISTRY/$image:latest"
          done
